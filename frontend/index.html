<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StudyHub — Study Groups, Shared Notes & Tutors for Students</title>
    <meta name="description" content="StudyHub is a peer-to-peer learning platform for students: join study groups, share and find course notes, ask questions in the Q&amp;A forum, and book verified tutors. Free to join." />

    <!-- %VITE_SITE_URL% is substituted by Vite at build time from the env file.
         It must be an absolute origin: crawlers and social scrapers do not
         resolve relative URLs in the tags below. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph — WhatsApp, LinkedIn, Slack, iMessage, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudyHub" />
    <meta property="og:title" content="StudyHub — Learn together. Grow together." />
    <meta property="og:description" content="Join study groups, share course notes, ask questions and book verified tutors. Free to join, no card needed." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StudyHub — study groups, shared notes, Q&amp;A and verified tutors." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyHub — Learn together. Grow together." />
    <meta name="twitter:description" content="Join study groups, share course notes, ask questions and book verified tutors. Free to join, no card needed." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="StudyHub — study groups, shared notes, Q&amp;A and verified tutors." />

    <!-- Fonts. preconnect first so the stylesheet request does not pay the
         DNS + TLS cost serially; gstatic needs crossorigin to match the
         font files' CORS mode. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "StudyHub",
        "description": "Peer-to-peer learning platform offering study groups, shared course notes, a Q&A forum and verified tutors.",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/pwa-512x512.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
