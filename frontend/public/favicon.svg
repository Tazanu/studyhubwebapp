<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="sh-mark-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
    </defs>

    <!-- background -->
    <rect width="512" height="512" rx="104" fill="url(#sh-mark-grad)" />

    <!-- hub-and-node mark: one center node connected to three satellites -->
    <g stroke="#ffffff" stroke-width="18" stroke-linecap="round">
        <line x1="256" y1="256" x2="256" y2="126" />
        <line x1="256" y1="256" x2="143" y2="321" />
        <line x1="256" y1="256" x2="369" y2="321" />
    </g>
    <circle cx="256" cy="126" r="34" fill="#ffffff" />
    <circle cx="143" cy="321" r="34" fill="#ffffff" />
    <circle cx="369" cy="321" r="34" fill="#ffffff" />
    <circle cx="256" cy="256" r="48" fill="#ffffff" />
</svg>
